{{define "content"}}
<div class="row spread">
  <h1>イベント</h1>
  <a class="button" href="/events/new">イベントを作る</a>
</div>
{{if .Data.Events}}
<ul class="events">
  {{range .Data.Events}}
  <li class="card">
    <a href="/events/{{.ID}}" class="event-title">{{.Title}}</a>
    <span class="muted">候補 {{.CandidateCount}} 件 ・ 回答 {{.AnswerCount}} 件 ・ 更新 {{jst .UpdatedAt}}</span>
  </li>
  {{end}}
</ul>
{{else}}
<p class="muted">まだイベントがありません。</p>
{{end}}
{{end}}
